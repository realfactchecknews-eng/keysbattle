<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КейсБатл.рф</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--s1:#10121a;--s2:#171a25;--line:#ffffff0f;--txt:#eef0f7;--mut:#8b91a7;--gold:#ffb800;--green:#3dff8a;--red:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2a2f40 transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.4 Rubik,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 15% -10%,#ff9d0014,transparent),radial-gradient(900px 600px at 100% 0,#8847ff14,transparent)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--txt);background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;margin-bottom:12px;outline:none}
input:focus{border-color:#ffb80066}
h3{font-size:15px;font-weight:600;margin-bottom:12px}
.mut{color:var(--mut)}
.co{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc629 42%,#b86e00);vertical-align:-.12em;margin-right:.3em;box-shadow:0 0 8px #ffb80055}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:0 20px;height:66px;background:#07080dd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font:800 19px Unbounded;letter-spacing:-.5px;cursor:pointer;white-space:nowrap}
.logo span{background:linear-gradient(90deg,#ffd24a,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}.logo em{font-style:normal;color:var(--mut);font-size:13px}
nav{display:flex;gap:2px;flex:1;height:100%}
nav button{position:relative;padding:0 14px;color:var(--mut);font-weight:500;transition:color .2s}
nav button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scaleX(0);transition:transform .25s}
nav button:hover,nav button.on{color:var(--txt)}nav button.on::after{transform:scaleX(1)}
.hr{display:flex;align-items:center;gap:10px}
.lvl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.lvl>b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8847ff,#4b69ff);color:#fff;font-size:13px}
.bar{width:74px;height:5px;border-radius:3px;background:#ffffff12;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8847ff,#d32ce6);transition:width .5s}
.bar.big{width:100%;height:8px;margin:10px 0 6px}.bar.big i{background:linear-gradient(90deg,#ffd24a,#ff7a00)}
.ico{width:38px;height:38px;border-radius:12px;background:#ffffff08}
.bal{padding:9px 14px;border-radius:12px;background:#ffffff08;box-shadow:inset 0 0 0 1px #ffb80033;font-weight:700;white-space:nowrap}
.bal.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.1);box-shadow:inset 0 0 0 1px var(--gold),0 0 20px #ffb80055}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:12px 20px;border-radius:12px;font-weight:700;color:#1b0f00;background:linear-gradient(180deg,#ffd13f,#ff9500);box-shadow:0 8px 24px -8px #ff9d00aa,inset 0 1px #ffffff80;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.btn.ghost{background:#ffffff0b;color:var(--txt);box-shadow:inset 0 0 0 1px #ffffff14}
.btn.big{padding:15px 26px;font-size:16px}.btn.sm{padding:9px 13px;font-size:13px}.btn.wide{width:100%}
#bonus.ready{animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 1px var(--gold),0 0 22px #ffb80066}}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:13px;background:#ffffff08;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13px;transition:.2s;white-space:nowrap}
.seg button:hover{color:var(--txt)}.seg button.on{background:#ffffff14;color:var(--txt);box-shadow:0 2px 8px #0006}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.row.l{justify-content:flex-start}

.feed{display:flex;gap:10px;padding:8px 20px;border-bottom:1px solid var(--line);background:#0a0b11;overflow:hidden}
.live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--green);letter-spacing:.08em}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
#feed{display:flex;gap:8px;flex:1;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)}
#feed .it{flex:0 0 112px;padding:5px 7px;animation:slideIn .6s cubic-bezier(.2,1.3,.4,1)}
#feed .it img{height:48px}#feed .it .n{font-size:10px}
@keyframes slideIn{from{transform:translateX(-120%) scale(.8);opacity:0}}

main{max-width:1240px;margin:auto;padding:26px 16px 60px}
.page{animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.ttl{font:800 30px Unbounded;letter-spacing:-.5px}
.sub{color:var(--mut);margin:6px 0 20px}
.gh{font:800 20px Unbounded;margin:34px 0 14px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px}
.back{color:var(--mut);margin-bottom:14px;font-weight:500}.back:hover{color:var(--txt)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
.scroll{max-height:470px;overflow:auto;padding:2px 4px 2px 2px}
.it{--c:#999;position:relative;isolation:isolate;overflow:hidden;border-radius:14px;padding:10px 9px 9px;background:linear-gradient(180deg,#181b27,#10121a);border:1px solid #ffffff0a;transition:transform .2s,border-color .2s,box-shadow .2s}
.it::before{content:"";position:absolute;inset:auto 0 0;height:75%;z-index:-1;background:radial-gradient(60% 80% at 50% 100%,color-mix(in srgb,var(--c) 36%,transparent),transparent)}
.it::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 12px 1px var(--c)}
.it img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;filter:drop-shadow(0 8px 10px #000a);transition:transform .35s cubic-bezier(.3,1.5,.5,1);user-select:none}
.it .n{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .n b{display:block;color:var(--txt);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.it .v{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:12px;font-weight:700;margin-top:3px;white-space:nowrap}
.it .v em{font-style:normal;font-weight:500;font-size:10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.it .tag{position:absolute;top:6px;right:6px;font:600 10px Rubik;font-style:normal;padding:2px 6px;border-radius:6px;background:#000a;color:var(--mut)}
.it .st{position:absolute;top:6px;left:6px;font:700 9px Rubik;font-style:normal;padding:2px 5px;border-radius:5px;background:#cf6a32;color:#fff}
.it.pick{cursor:pointer}.it.pick:hover{transform:translateY(-3px);border-color:#ffffff24}.it.pick:hover img{transform:scale(1.08) rotate(-4deg)}
.it.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 18px -4px #ffb80088}
.it.sel .n b::before{content:"✓ ";color:var(--gold)}
.it.hit{animation:hit 1.1s ease both;border-color:var(--c)}
@keyframes hit{35%{transform:scale(1.07);box-shadow:0 0 40px -2px var(--c)}100%{box-shadow:0 0 24px -6px var(--c)}}
.drop{animation:dropIn .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dropIn{from{transform:perspective(700px) rotateY(100deg) scale(.5);opacity:0}}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:40px;border-radius:30px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(60% 90% at 88% 25%,#ff9d0030,transparent),radial-gradient(50% 80% at 5% 100%,#8847ff30,transparent),linear-gradient(180deg,#141722,#0c0e15)}
.hero h1{font:800 clamp(30px,4.4vw,50px)/1.05 Unbounded;letter-spacing:-1px;margin:16px 0 12px}
.hero h1 span{background:linear-gradient(90deg,#ffd24a,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:460px;margin-bottom:10px}
.pill{display:inline-flex;gap:6px;padding:6px 12px;border-radius:99px;background:#3dff8a12;color:var(--green);font-size:12px;font-weight:600}
.hs{position:relative;min-height:280px}
.fl{position:absolute;width:62%;filter:drop-shadow(0 24px 30px #000d);animation:float 6s ease-in-out infinite}
.f0{top:0;left:2%;--r:-14deg}.f1{top:28%;right:0;width:52%;--r:12deg;animation-delay:-2s}.f2{bottom:0;left:22%;width:56%;--r:-4deg;animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-16px) rotate(calc(var(--r) + 4deg))}}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.case{--c:#ffb800;position:relative;overflow:hidden;cursor:pointer;text-align:center;padding:16px 14px 14px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--s1)),var(--s1) 62%);transition:transform .3s cubic-bezier(.3,1.4,.5,1),border-color .3s,box-shadow .3s}
.case:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 24px 40px -22px var(--c)}
.cimg{position:relative;height:130px;display:grid;place-items:center}
.cimg::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);filter:blur(8px);transition:transform .4s}
.cimg img{position:relative;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 16px #000c);transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.case:hover .cimg img{transform:scale(1.1) rotate(-6deg)}.case:hover .cimg::before{transform:scale(1.35)}
.case h3{font:600 13px Unbounded;margin:8px 0 2px;min-height:34px;display:grid;place-items:center}
.case .rtp{font-size:11px;color:var(--mut)}
.price{display:inline-flex;align-items:center;margin-top:10px;padding:7px 14px;border-radius:10px;background:#ffffff0b;font-weight:700}
.case.mini{padding:10px;border-radius:16px}.case.mini .cimg{height:70px}.case.mini .cimg::before{width:60px;height:60px}.case.mini h3{font-size:10px;min-height:26px}.case.mini .rtp{display:none}.case.mini .price{margin-top:4px;font-size:12px;padding:4px 10px}
.cases.sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}

.ohead{display:flex;align-items:center;gap:22px;margin-bottom:18px;flex-wrap:wrap}.ohead .cimg{width:170px;height:130px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.facts div{padding:8px 12px;border-radius:12px;background:#ffffff08;font-size:13px}.facts small{display:block;color:var(--mut);font-size:11px}
.reels{display:grid;gap:10px}
.reels.cols{grid-template-columns:repeat(var(--n),minmax(0,240px));justify-content:center}
.reel{position:relative;overflow:hidden;border-radius:20px;background:var(--s1);border:1px solid var(--line)}
.reel::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--s1),transparent 20%,transparent 80%,var(--s1))}
.reel::after{content:"";position:absolute;z-index:3;left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px;border-radius:2px;background:var(--gold);box-shadow:0 0 16px 2px #ffb800aa}
.track{display:flex;gap:8px;padding:10px;will-change:transform}
.track .it{flex:0 0 160px}
.reels.m .track .it{flex-basis:126px}.reels.m .track .it .n{font-size:10px}
.reel.v{height:440px}.reel.v .track{flex-direction:column}.reel.v .track .it{flex:0 0 auto}
.reel.v::before{background:linear-gradient(180deg,var(--s1),transparent 24%,transparent 76%,var(--s1))}
.reel.v::after{left:6px;right:6px;top:50%;bottom:auto;width:auto;height:2px;margin:-1px 0 0}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:18px 0 8px}
.tierh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;padding-left:12px;border-left:3px solid var(--c)}
.tierh span{font-weight:600;color:var(--c)}.tierh b{font-size:13px;color:var(--mut)}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#ffffff06;color:var(--mut);font-size:13px}

.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:#05060acc;backdrop-filter:blur(10px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;overflow:hidden;width:100%;max-width:940px;max-height:92vh;overflow-y:auto;text-align:center;padding:30px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#171a26,#0d0f16);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.mbox.bare{background:none;border:0;overflow:visible}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mbox>*{position:relative;z-index:1}
.mbox>.rays{position:absolute;z-index:0;inset:-60%;display:none;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 22%,transparent) 0 8deg,transparent 8deg 16deg);mask-image:radial-gradient(closest-side,#000,transparent);animation:spin 24s linear infinite}
.mbox.rare>.rays{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.mt{font:800 24px Unbounded}
.wins{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px 0 10px}.wins .it{width:200px}
.msum{font-weight:700;font-size:18px}
.big-e{font-size:70px;animation:pop .5s}
.toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{padding:12px 18px;border-radius:14px;background:#1c2030f2;border:1px solid #ffffff1a;font-weight:500;box-shadow:0 12px 30px #0008;animation:tIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes tIn{from{transform:translateY(-20px) scale(.9);opacity:0}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:70}

.upg{display:grid;grid-template-columns:1fr 330px 1fr;gap:20px;align-items:center;padding:24px;border-radius:26px;border:1px solid var(--line);background:radial-gradient(40% 60% at 50% 45%,#ffb80012,transparent),var(--s1)}
.uslot{min-height:300px;display:grid;place-items:center;align-content:center;padding:12px;border-radius:20px;background:#ffffff04;border:1px dashed #ffffff14}
.uslot .it.big{width:100%;max-width:270px}
.ph{display:grid;gap:4px;text-align:center;color:var(--mut)}.ph span{font-size:40px;opacity:.5}.ph small{opacity:.6}
.stack{display:grid;gap:8px;width:100%;grid-template-columns:repeat(2,1fr)}.stack.n1{grid-template-columns:minmax(0,260px);justify-content:center}.stack.n5,.stack.n6{grid-template-columns:repeat(3,1fr)}
.sum{margin-top:12px;font-weight:700}
.wheel{position:relative;width:290px;height:290px;margin:0 auto 8px}
.wheel svg{width:100%;height:100%;filter:drop-shadow(0 0 20px #ffb80040);transition:filter .4s}
.needle{position:absolute;inset:0;will-change:transform}
.wheel.spin svg{animation:wglow 1.2s ease-in-out infinite}
@keyframes wglow{50%{filter:drop-shadow(0 0 36px #ffb800aa)}}.needle i{position:absolute;left:50%;top:6px;width:6px;height:34px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff,0 0 26px var(--gold)}
.mid{position:absolute;inset:58px;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(#1c2030,#0d0f16);box-shadow:inset 0 0 0 1px #ffffff12,0 10px 30px #0008}
.mid b{font:800 34px Unbounded;transition:color .3s}.mid b small{font-size:17px}.mid span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.wheel.win svg{filter:drop-shadow(0 0 34px var(--green))}.wheel.win .mid b{color:var(--green)}
.wheel.lose{animation:shake .5s}.wheel.lose svg{filter:drop-shadow(0 0 30px var(--red)) grayscale(.6)}.wheel.lose .mid b{color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.burn{animation:burn 1.1s forwards}
@keyframes burn{to{filter:grayscale(1) brightness(.2) blur(4px);transform:scale(.75) translateY(24px) rotate(8deg);opacity:0}}
.addbal{width:100%;margin-top:14px;display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:#ffffff06}
.slhead,.slfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}.slhead b{color:var(--txt);font-size:15px}.slfoot{font-size:11px}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;margin:6px 0;padding:0;border:0;border-radius:6px;cursor:pointer;background:linear-gradient(90deg,#ffd24a,#ff7a00) 0/var(--v) 100% no-repeat,#ffffff14;box-shadow:inset 0 1px 3px #0008}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc629 45%,#b86e00);box-shadow:0 0 0 5px #ffb80030,0 0 18px #ffb80088,0 4px 10px #0009;transition:transform .15s,box-shadow .15s}
.slider:hover::-webkit-slider-thumb{box-shadow:0 0 0 7px #ffb80040,0 0 24px #ffb800aa,0 4px 10px #0009}
.slider:active::-webkit-slider-thumb{transform:scale(1.18)}
.slider::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc629 45%,#b86e00);box-shadow:0 0 0 5px #ffb80030,0 0 18px #ffb80088}
.slider:disabled{opacity:.35;cursor:default}
#uarc{transition:stroke-dasharray .15s ease-out}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.phd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.phd h3{margin:0}

.ctop{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;padding:22px;margin-bottom:16px;border-radius:26px;border:1px solid var(--line);background:radial-gradient(50% 80% at 20% 50%,#8847ff18,transparent),var(--s1)}
.cslots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cslot{aspect-ratio:1;display:grid;place-items:center;border-radius:16px;border:1px dashed #ffffff14;background:#ffffff04;color:#ffffff22;font-weight:700;overflow:hidden}
.cslot.on{border:1px solid var(--c);background:radial-gradient(color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.cslot img{width:92%;filter:drop-shadow(0 6px 8px #000a)}
.cinfo{display:grid;gap:4px}.cinfo small{color:var(--mut)}.cinfo b{font-size:20px}.cinfo .btn{margin-top:10px}
.ritual{position:relative;width:340px;height:340px;margin:auto}
.ritual img{position:absolute;left:50%;top:50%;width:100px;margin:-38px 0 0 -50px;filter:drop-shadow(0 0 12px #ffb80099);transform:rotate(var(--a)) translateY(-135px) rotate(calc(-1 * var(--a)));animation:suck 2.6s cubic-bezier(.55,0,.85,.35) forwards}
@keyframes suck{to{transform:rotate(calc(var(--a) + 720deg)) translateY(0) rotate(calc(-1 * var(--a) - 720deg)) scale(.15);opacity:0}}
.core{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(#fff,#ffcf3f 40%,transparent 70%);animation:core 2.6s ease-in forwards}
@keyframes core{80%{transform:scale(2.4)}100%{transform:scale(16);opacity:0}}

.bset{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.sticky{position:sticky;top:130px}
.rnd{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:6px;border-radius:12px;background:#ffffff06;cursor:pointer;transition:.2s;animation:pageIn .3s}
.rnd img{width:48px;height:36px;object-fit:contain}.rnd b{display:block;font-size:13px;font-weight:600}.rnd small{font-size:12px}.rnd em{margin-left:auto;font-style:normal;color:var(--mut)}
.rnd:hover{background:#ff4d4d1f}.rnd:hover em{color:var(--red)}
.bset .seg{margin-bottom:14px}
.rlabel{text-align:center;font:600 18px Unbounded;margin:6px 0 18px;min-height:26px}
.arena{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.pl{padding:12px;border-radius:20px;border:1px solid var(--line);background:var(--s1);transition:all .5s}
.plh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.plh b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 16px Unbounded;background:#ffffff0d}
.pl.me .av{background:linear-gradient(135deg,#ffd24a55,#ff7a0055)}
.tot{margin-left:auto;font-weight:700;white-space:nowrap}
.pl .reel.v{height:300px}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;margin-top:10px}
.drops .it{padding:4px}.drops .it .n,.drops .it .v,.drops .it .st{display:none}
.pl.winner{border-color:var(--gold);box-shadow:0 0 60px -12px #ffb800bb;transform:translateY(-6px)}
.pl.loser{filter:grayscale(.85) brightness(.55)}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.stats>div{padding:14px 18px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:18px}
.stats .best{display:flex;align-items:center;gap:10px;border-color:var(--c)}.best img{width:70px}.best b{font-size:13px}
.empty{text-align:center;padding:60px 0;color:var(--mut)}
.farm{display:grid;place-items:center;gap:18px;padding:40px 16px;border-radius:26px;border:1px solid var(--line);background:radial-gradient(40% 60% at 50% 45%,#ffb80018,transparent),var(--s1);position:relative;overflow:hidden;user-select:none}
.fbtn{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc629 42%,#b86e00);box-shadow:0 0 60px #ffb80066,inset 0 -10px 20px #0004;font:800 44px Unbounded;color:#5a3500;transition:transform .08s}
.fbtn:hover{box-shadow:0 0 90px #ffb80099,inset 0 -10px 20px #0004}.fbtn:active{transform:scale(.92)}
.plus{position:absolute;font:800 22px Unbounded;color:var(--gold);pointer-events:none;text-shadow:0 0 12px #ffb800aa;animation:plus .9s ease-out forwards}
@keyframes plus{to{transform:translateY(-90px);opacity:0}}

@media(max-width:900px){
 header{height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}nav{order:3;width:100%;height:40px;overflow-x:auto;flex:none}.hr{margin-left:auto}.lvl>div{display:none}
 .hero,.upg,.pick2,.ctop,.bset{grid-template-columns:1fr}.hero{padding:24px}.hs{min-height:200px}.sticky{position:static}
 .track .it{flex-basis:126px}.reel.v{height:360px}.arena{gap:6px}.pl{padding:6px}.plh .av{display:none}.plh{font-size:12px}
}

<body>
<header>
  <div class="logo" data-go="cases">КЕЙС<span>БАТЛ</span><em>.рф</em></div>
  <nav id="nav">
    <button data-go="cases">Кейсы</button><button data-go="battles">Батлы</button><button data-go="upgrade">Апгрейд</button><button data-go="contracts">Контракты</button><button data-go="inv">Инвентарь</button><button data-go="farm">Фарм</button>
  </nav>
  <div class="hr">
    <div class="lvl" id="lvl"></div>
    <button class="ico" id="snd" title="Звук"></button>
    <button class="btn sm ghost" id="bonus"></button>
    <div class="bal" id="bal"></div>
  </div>
</header>
<div class="feed"><div class="live">LIVE</div><div id="feed"></div></div>
<main id="main"></main>
<script src="data.js"></script>
<script>
// Деньги ненастоящие (1 монета ≈ 1 ₽ по ценам Skinport), всё хранится в localStorage.
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
// Честный рандом: криптостойкий генератор браузера, без подкруток.
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
const pick=a=>a[Math.floor(rnd()*a.length)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pct=p=>p>=10?p.toFixed(1):p>=.1?p.toFixed(2):p>=.0001?p.toPrecision(2):'<0.0001';
const fmt=n=>`<i class="co"></i>${Math.round(n).toLocaleString('ru')}`;
const RC=['#b0c3d9','#5e98d9','#4b69ff','#8847ff','#d32ce6','#eb4b4b','#ffd700'];
const TN=['Ширпотреб','Промышленное','Армейское','Запрещённое','Засекреченное','Тайное','★ Редкий особый предмет'];
const WN=['FN','MW','FT','WW','BS'],WB=[0,.07,.15,.38,.45,1];

// ---------- предметы ----------
// SKINS[i] = [имя, редкость, картинка, minFloat, maxFloat, цены[5 износов] | цена, цены StatTrak | 0]
SKINS.forEach((s,i)=>{s.id=i;s.nw=!Array.isArray(s[5])});
const wearOf=f=>{let w=0;while(w<4&&f>=WB[w+1])w++;return w};
function priceOf(s,w,st){
  const a=st&&s[6]?s[6]:s[5];
  if(s.nw)return a;
  if(a[w])return a[w];
  for(let d=1;d<5;d++){if(a[w-d])return a[w-d];if(a[w+d])return a[w+d]}
  return s[5].find(Boolean);
}
const price=it=>priceOf(SKINS[it.id],it.w,it.st);
function overlap(s,w){if(s.nw)return 1;const lo=Math.max(WB[w],s[3]),hi=Math.min(WB[w+1],s[4]);return hi>lo?(hi-lo)/((s[4]-s[3])||1):0}
// матожидание цены предмета: float равномерно в диапазоне скина, StatTrak с шансом 10%
function ev(s){
  const k=s[6]?.1:0,v=w=>(1-k)*priceOf(s,w,false)+k*priceOf(s,w,true);
  if(s.nw)return v(-1);
  let e=0;for(let w=0;w<5;w++){const o=overlap(s,w);if(o)e+=o*v(w)}return e;
}
SKINS.forEach(s=>s.ev=ev(s));
function mkItem(s){const f=s.nw?null:s[3]+rnd()*(s[4]-s[3]);return{id:s.id,f,w:s.nw?-1:wearOf(f),st:!!s[6]&&rnd()<.1}}
// все варианты (скин × износ × StatTrak) — для апгрейда и контрактов
const VARS=[];
SKINS.forEach(s=>{for(const w of s.nw?[-1]:[0,1,2,3,4].filter(w=>overlap(s,w)>0))for(const st of s[6]?[false,true]:[false])VARS.push({id:s.id,w,st,p:priceOf(s,w,st)})});
VARS.sort((a,b)=>a.p-b.p);
function fromVar(v){const s=SKINS[v.id];let f=null;if(!s.nw){const lo=Math.max(WB[v.w],s[3]),hi=Math.min(WB[v.w+1],s[4]);f=lo+rnd()*(hi-lo)}return{id:v.id,w:v.w,st:v.st,f}}

// ---------- кейсы ----------
const CASES=[];
function addCase(c){
  c.items=c.items.filter(x=>x.w>0);
  c.W=c.items.reduce((a,x)=>a+x.w,0);
  c.ev=c.items.reduce((a,x)=>a+x.w*SKINS[x.id].ev,0)/c.W;
    const top=c.items.reduce((a,x)=>SKINS[x.id].ev>SKINS[a.id].ev?x:a);
  c.color=RC[SKINS[top.id][1]];
  if(!c.img)c.img=IMG+SKINS[top.id][2];
  let acc=0;c.cum=c.items.map(x=>acc+=x.w);
  CASES.push(c);
}
function roll(c){
  const x=rnd()*c.W;let lo=0,hi=c.cum.length-1;
  while(lo<hi){const m=(lo+hi)>>1;if(c.cum[m]>x)hi=m;else lo=m+1}
  return mkItem(SKINS[c.items[lo].id]);
}
const isGlove=s=>/Gloves|Hand Wraps/.test(s[0]),isKnife=s=>s[1]===6&&!isGlove(s);
const wpn=(...w)=>s=>w.some(x=>s[0].startsWith(x+' |'));
const starts=(...n)=>s=>n.some(x=>s[0].startsWith(x));
// Тематические кейсы: цена дропа распределена логнормально вокруг цены кейса —
// в основном среднячок, крупные иксы и копеечный дроп редко. Центр подбирается под окупаемость 90%.
const SIG=.8,RTP=1; // окупаемость кейсов 100%
function themed(n,P,f,opt={}){
  const pool=Array.isArray(f)?f.map(i=>SKINS[i]):SKINS.filter(f),L=pool.map(s=>Math.log(s.ev)),bin=L.map(l=>Math.floor(l/.25)),cnt={};
  bin.forEach(b=>cnt[b]=(cnt[b]||0)+1);
  const make=mu=>pool.map((s,i)=>({id:s.id,w:Math.exp(-((L[i]-Math.log(P)-mu)**2)/(2*SIG*SIG))/cnt[bin[i]]}));
  const EV=it=>{let W=0,E=0;for(const x of it){W+=x.w;E+=x.w*SKINS[x.id].ev}return E/W};
  let lo=-8,hi=4;for(let k=0;k<40;k++){const m=(lo+hi)/2;EV(make(m))<RTP*P?lo=m:hi=m}
  const items=make(lo),e=EV(items);
  addCase({themed:!opt.g,...opt,n,items,p:Math.abs(e-RTP*P)<.03*P?P:Math.ceil(e/RTP)});
}
const PISTOL=wpn('Glock-18','USP-S','P2000','P250','Desert Eagle','Five-SeveN','Tec-9','CZ75-Auto','Dual Berettas','R8 Revolver');
[['Мелочь',15,()=>1],['Сотка',100,()=>1],['Бюджетный',500,()=>1],['Пистолетный',1000,PISTOL],['Glock-18',1500,wpn('Glock-18')],['USP-S',2000,wpn('USP-S')],
 ['Desert Eagle',2500,wpn('Desert Eagle')],['AK-47',3000,wpn('AK-47')],['M4',3500,wpn('M4A4','M4A1-S')],['AWP',4000,wpn('AWP')],['Средний класс',7000,()=>1],
 ['Засекреченный',10000,s=>s[1]===4||s[1]===5],['AK-47 премиум',15000,wpn('AK-47')],['AWP премиум',20000,wpn('AWP')],['Дешёвые ножи',20000,s=>isKnife(s)&&s.ev<40000],
 ['Дорогие скины',30000,()=>1],['Тайный',50000,s=>s[1]===5],['Перчатки',60000,isGlove],['Ножи',80000,isKnife],['Спортивные перчатки',150000,starts('★ Sport Gloves')],
 ['Karambit',250000,starts('★ Karambit')],['M9 Bayonet',250000,starts('★ M9 Bayonet')],['Butterfly Knife',300000,starts('★ Butterfly Knife')],['Коллекционер',500000,()=>1]
].forEach(a=>themed(...a));
CASES.forEach(c=>{if(c.themed)c.g=c.p<1000?'Недорогие кейсы':c.p<20000?'Средние кейсы':'Дорогие кейсы'});
CASES.sort((a,b)=>(!!b.themed-!!a.themed)||(a.themed?a.p-b.p:0));
REAL.slice().reverse().forEach(([n,img,p,ids,rare])=>themed(n,p,[...ids,...rare],{g:'Официальные кейсы CS2',img:img.startsWith('http')?img:IMG+img}));

// ---------- состояние ----------
const DEF={bal:3000,inv:[],bonus:0,xp:0,n:0,sound:true,mode:'h',stats:{opened:0,best:null,upW:0,upT:0,ct:0,bw:0,bt:0}};
let st=structuredClone(DEF);
try{const o=JSON.parse(localStorage.kb2);if(o){Object.assign(st,o);st.stats={...DEF.stats,...o.stats}}}catch(e){}
const lvl=()=>Math.floor(Math.sqrt(st.xp/2000))+1;
function save(){
  try{localStorage.kb2=JSON.stringify(st)}catch(e){}
  const b=$('#bal');b.innerHTML=fmt(st.bal);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');
  const L=lvl(),lo=(L-1)**2*2000,hi=L*L*2000;
  $('#lvl').innerHTML=`<b>${L}</b><div>Уровень<div class="bar"><i style="width:${(st.xp-lo)/(hi-lo)*100}%"></i></div></div>`;
  $('#snd').textContent=st.sound?'🔊':'🔇';
}
function pay(n){const L=lvl();st.bal-=n;st.xp+=n;save();if(lvl()>L){toast(`Новый уровень: ${lvl()}. Бонус увеличен`);chime()}}
function give(it){st.inv.unshift({...it,uid:++st.n});if(!st.stats.best||price(it)>price(st.stats.best))st.stats.best=it;return st.inv[0]}
function sell(uids){let sum=0;st.inv=st.inv.filter(x=>uids.includes(x.uid)?(sum+=price(x),false):true);st.bal+=sum;save();if(sum)coin();return sum}
const byUid=u=>st.inv.find(x=>x.uid===u);
const noMoney=()=>toast('Недостаточно монет — возьми бонус');

// ---------- звук ----------
let AC;
function beep(f,d=.05,type='square',v=.03,when=0){
  if(!st.sound)return;
  try{AC=AC||new AudioContext();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const tick=()=>beep(1000,.025,'square',.018);
const chime=()=>[523,659,784,1047].forEach((f,i)=>beep(f,.3,'triangle',.07,i*.09));
const sad=()=>[392,311,233].forEach((f,i)=>beep(f,.35,'sawtooth',.04,i*.16));
const coin=()=>[1200,1650].forEach((f,i)=>beep(f,.09,'sine',.07,i*.07));

// ---------- эффекты ----------
function toast(h){let w=$('.toasts');if(!w){w=document.createElement('div');w.className='toasts';document.body.append(w)}const d=document.createElement('div');d.className='toast';d.innerHTML=h;w.append(d);setTimeout(()=>d.remove(),2800)}
function confetti(colors,n=140){
  const c=document.createElement('canvas');c.className='fx';c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext('2d'),P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*22,vy:-Math.random()*20-4,s:5+Math.random()*7,r:Math.random()*6,c:colors[n%colors.length]})).map((p,i)=>({...p,c:colors[i%colors.length]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);for(const p of P){p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}if(++f<160)requestAnimationFrame(loop);else c.remove()})();
}
function modal(h,cls='',onClose,lock){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox ${cls}">${h}</div>`;
  if(!lock)m.onclick=e=>{if(e.target===m){m.remove();onClose&&onClose()}};
  document.body.append(m);return m;
}
function reveal(got,title,after){
  const sum=got.reduce((a,g)=>a+price(g),0),top=Math.max(...got.map(g=>SKINS[g.id][1]));
  if(top>=5){confetti(top>5?['#ffd700','#fff4b0','#ff9d00','#fff']:['#eb4b4b','#ff9a9a','#fff']);chime()}else if(top>=3)chime();else beep(700,.12,'triangle',.06);
  const close=()=>{m.remove();after&&after()};
  const m=modal(`<div class="rays" style="--c:${RC[top]}"></div><h3 class="mt">${title}</h3><div class="wins">${got.map((g,i)=>card(g,{cls:'drop',style:`animation-delay:${i*.12}s`,full:1})).join('')}</div><div class="msum">Итого ${fmt(sum)}</div><div class="row"><button class="btn big ghost" data-k>Забрать</button><button class="btn big" data-s>Продать за ${fmt(sum)}</button></div>`,top>=4?'rare':'',()=>after&&after());
  $('[data-k]',m).onclick=close;
  $('[data-s]',m).onclick=()=>{sell(got.map(g=>g.uid));close()};
}

// it = {id, w (износ, -1 если нет), st, f (float)}; o.price — своя подпись цены
function card(it,o={}){
  const s=SKINS[it.id],[a,b]=s[0].split(' | ');
  const wear=it.w>=0?WN[it.w]+(it.f!=null&&o.full?' · '+it.f.toFixed(4):''):'';
  return `<div class="it ${o.cls||''}" style="--c:${RC[s[1]]};${o.style||''}" ${o.attr||''} title="${(it.st?'StatTrak™ ':'')+s[0]}">${it.st?'<i class="st">ST™</i>':''}${o.tag?`<i class="tag">${o.tag}</i>`:''}<img src="${IMG+s[2]}" alt="" draggable="false" loading="${o.lazy?'lazy':'eager'}"><div class="n"><b>${a}</b>${b||'&nbsp;'}</div><div class="v"><span>${o.price??fmt(price(it))}</span><em>${wear}</em></div></div>`;
}

// прокрутка ленты: горизонтальная или вертикальная (.v)
function spin(reel,items,N,dur,quiet){
  const tr=$('.track',reel);
  tr.getAnimations().forEach(a=>a.cancel());
  tr.innerHTML=items.map(s=>card(s)).join('');
  const v=reel.classList.contains('v'),el=tr.children[N];
  const size=v?el.offsetHeight:el.offsetWidth,pos=v?el.offsetTop:el.offsetLeft,box=v?reel.clientHeight:reel.clientWidth;
  if(!size)return Promise.resolve();
  const d=-(pos+size/2-box/2)+(rnd()-.5)*size*.8,ax=v?'Y':'X',step=size+8;
  const a=tr.animate([{transform:`translate${ax}(0px)`},{transform:`translate${ax}(${d}px)`}],{duration:dur,easing:'cubic-bezier(.1,.65,.12,1)',fill:'forwards'});
  let last=0;
  if(!quiet)(function loop(){if(a.playState==='finished'||a.playState==='idle')return;const m=new DOMMatrix(getComputedStyle(tr).transform),i=Math.floor(Math.abs(v?m.m42:m.m41)/step);if(i!==last){last=i;tick()}requestAnimationFrame(loop)})();
  return a.finished.then(()=>el.classList.add('hit'));
}

const FR=['Санёк','Дед Инсайд','xX_Sniper_Xx','Мамин Хакер','ЛудоМан','Бот Вася','Жека','Скуф'];
function feed(it,who){
  const f=$('#feed'),s=SKINS[it.id];
  f.insertAdjacentHTML('afterbegin',`<div class="it" style="--c:${RC[s[1]]}" title="${s[0]}"><img src="${IMG+s[2]}" alt=""><div class="n"><b>${who}</b>${s[0].split(' | ')[1]||s[0]}</div></div>`);
  while(f.children.length>24)f.lastChild.remove();
}
setInterval(()=>{if(!document.hidden)feed(roll(pick(CASES)),pick(FR))},2600);

// ---------- роутинг ----------
let page;const PAGES={};
function go(p,arg){
  page=p;
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===(p==='open'?'cases':p)));
  const m=$('#main');m.innerHTML='<div class="page"></div>';PAGES[p](m.firstChild,arg);
  if(p!=='open')history.replaceState(null,'','#'+p);
  scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});

const caseCard=(c,cls='')=>`<div class="case ${cls}" data-c="${CASES.indexOf(c)}" style="--c:${c.color}"><div class="cimg"><img src="${c.img}" alt="" loading="lazy"></div><h3>${c.n}</h3><div class="rtp">окупаемость ${Math.round(c.ev/c.p*100)}%</div><div class="price">${fmt(c.p)}</div></div>`;

PAGES.cases=el=>{
  const top=VARS.slice(-400),hs=[pick(top),pick(top),pick(top)];
  el.innerHTML=`<section class="hero"><div><div class="pill">● Честный рандом · окупаемость 100%</div><h1>Кейсы CS2<br><span>без реальных денег</span></h1>
    <p>Настоящие скины и рыночные цены Skinport. Износ выпадает по float, StatTrak — с шансом 10%. Вероятность каждого предмета открыта.</p>
    <div class="row l"><button class="btn big" data-go="battles">Кейс-батл</button><button class="btn big ghost" data-go="upgrade">Апгрейд</button><button class="btn big ghost" data-go="contracts">Контракт</button></div></div>
    <div class="hs">${hs.map((v,i)=>`<img class="fl f${i}" src="${IMG+SKINS[v.id][2]}" alt="">`).join('')}</div></section>`
    +[...new Set(CASES.map(c=>c.g))].map(g=>`<h2 class="gh">${g}</h2><div class="cases">${CASES.filter(c=>c.g===g).map(c=>caseCard(c)).join('')}</div>`).join('');
  $$('.case',el).forEach(x=>x.onclick=()=>go('open',CASES[x.dataset.c]));
};

PAGES.open=(el,c)=>{
  let cnt=1,busy=false;
  const range=s=>{const p=VARS.filter(v=>v.id===s.id).map(v=>v.p);return Math.min(...p)===Math.max(...p)?fmt(p[0]):fmt(Math.min(...p))+'+'};
  el.innerHTML=`<button class="back" data-go="cases">← Все кейсы</button>
  <div class="ohead" style="--c:${c.color}"><div class="cimg"><img src="${c.img}" alt=""></div><div><h1 class="ttl">${c.n}</h1>
   <div class="facts"><div><small>Цена</small>${fmt(c.p)}</div><div><small>Средний дроп</small>${fmt(c.ev)}</div><div><small>Окупаемость</small>${(c.ev/c.p*100).toFixed(1)}%</div><div><small>Предметов</small>${c.items.length}</div><div><small>Шанс окупиться</small>${pct(c.items.reduce((a,x)=>a+(SKINS[x.id].ev>=c.p?x.w:0),0)/c.W*100)}%</div></div></div></div>
  <div id="reels"></div>
  <div class="ctrl"><div class="seg" id="modes">${[['h','Лента'],['v','Барабан'],['f','Быстро']].map(([k,t])=>`<button data-m="${k}">${t}</button>`).join('')}</div>

PAGES.upgrade=el=>{

      <div class="row"><div class="seg"><button data-um="n" class="${up.mode==='n'?'on':''}">Обычный</button><button data-um="g" class="${up.mode==='g'?'on':''}">Азартный</button></div></div>
      <button class="btn big wide" id="ub" ${p&&!up.busy?'':'disabled'}>${up.busy?'Крутим…':'Апгрейд'}</button></div>
    <div class="uslot" id="ud">${t?card(t,{cls:'big',price:fmt(t.p)}):'<div class="ph"><span>◎</span>Выбери цель<small>из списка ниже</small></div>'}</div></div>`;
    
    const sl=$('#uc',el);

  };
  const mine=()=>{
    const list=st.inv.slice().sort((a,b)=>price(b)-price(a));
    $('#um',el).innerHTML=list.length?list.map(x=>card(x,{cls:'pick'+(up.sel.includes(x.uid)?' sel':''),attr:`data-u="${x.uid}"`})).join(''):'<p class="mut">Инвентарь пуст</p>';
    $$('#um .it',el).forEach(d=>d.onclick=()=>{
      if(up.busy)return;const u=+d.dataset.u,i=up.sel.indexOf(u);

    const nd=$('#nd',el),r=d=>({transform:`rotate(${d}deg)`}),b=up.rot;let kf,dur;
    if(up.mode==='g'){ // азартный: разгон, разворот назад, снова вперёд, проскок и откат к результату

      kf=[{...r(b),easing:'cubic-bezier(.6,0,.4,1)'},{...r(b+900+rnd()*360),offset:.22,easing:'cubic-bezier(.3,0,.5,1)'},{...r(b+300+rnd()*200),offset:.4,easing:'cubic-bezier(.5,0,.3,1)'},
          {...r(to+sd*(30+rnd()*40)),offset:.72,easing:'cubic-bezier(.4,0,.4,1)'},{...r(to-sd*(10+rnd()*15)),offset:.87,easing:'cubic-bezier(.4,0,.3,1)'},{...r(to),offset:1}];
      dur=6800;
    }else{kf=[r(b),r(360*5+ang)];dur=7500}

    await a.finished;up.rot=ang;
    const used=up.sel.slice();st.inv=st.inv.filter(x=>!used.includes(x.uid));st.stats.upT++;up.coins=0;
    const wh=$('#wh',el);wh.classList.remove('spin');

  };
  top();mine();targets();

const bt={r:[],n:2};
PAGES.battles=el=>{
  const cost=()=>bt.r.reduce((a,c)=>a+c.p,0);
  const setup=()=>{
    el.innerHTML=`<h1 class="ttl">Кейс-батлы</h1><p class="sub">Собери раунды и выбери число игроков. У всех одинаковые кейсы и одинаковый рандом. Кто в сумме вытащил дороже — забирает всё.</p>
    <div class="bset"><div class="panel sticky"><h3>Раунды ${bt.r.length}/8</h3><div>${bt.r.map((c,i)=>`<div class="rnd" data-i="${i}"><img src="${c.img}" alt=""><div><b>${c.n}</b><small>${fmt(c.p)}</small></div><em>✕</em></div>`).join('')||'<p class="mut" style="margin-bottom:14px">Нажимай на кейсы, чтобы добавить раунды</p>'}</div>
    <h3 style="margin-top:14px">Игроки</h3><div class="seg" id="bn">${[2,3,4].map(n=>`<button data-n="${n}" class="${bt.n===n?'on':''}">${['','','1 на 1','1v1v1','1v1v1v1'][n]}</button>`).join('')}</div>
    <button class="btn big wide" id="bs" ${bt.r.length?'':'disabled'}>Начать · ${fmt(cost())}</button></div>
    <div class="cases sm">${CASES.map(c=>caseCard(c,'mini')).join('')}</div></div>`;
    $$('.case',el).forEach(x=>x.onclick=()=>{if(bt.r.length<8){bt.r.push(CASES[x.dataset.c]);setup()}else toast('Максимум 8 раундов')});
    $$('.rnd',el).forEach(x=>x.onclick=()=>{bt.r.splice(+x.dataset.i,1);setup()});
    $$('#bn button',el).forEach(b=>b.onclick=()=>{bt.n=+b.dataset.n;setup()});
    $('#bs',el).onclick=start;
  };
  const start=()=>{if(st.bal<cost())return noMoney();pay(cost());st.stats.opened+=bt.r.length;battle()};
  const battle=async()=>{
    const bots=FR.slice();for(let i=bots.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[bots[i],bots[j]]=[bots[j],bots[i]]}
    const P=[{n:'Ты',me:1},...bots.slice(0,bt.n-1).map(n=>({n}))].map(p=>({...p,items:[],tot:0}));
    el.innerHTML=`<h1 class="ttl">Батл</h1><div class="rlabel" id="rl"></div>
    <div class="arena" style="--n:${P.length}">${P.map((p,i)=>`<div class="pl ${p.me?'me':''}" id="p${i}"><div class="plh"><div class="av">${p.n[0]}</div><b>${p.n}</b><span class="tot">${fmt(0)}</span></div><div class="reel v"><div class="track"></div></div><div class="drops"></div></div>`).join('')}</div>
    <div class="row" id="bend"></div>`;
    for(const [r,c] of bt.r.entries()){
      $('#rl',el).innerHTML=`Раунд ${r+1}/${bt.r.length} · ${c.n}`;
      const w=P.map(()=>roll(c));
      await Promise.all(P.map((p,i)=>spin($(`#p${i} .reel`,el),Array.from({length:30},(_,k)=>k===24?w[i]:roll(c)),24,3400,i>0)));
      P.forEach((p,i)=>{p.items.push(w[i]);p.tot+=price(w[i]);const b=$(`#p${i}`,el);$('.tot',b).innerHTML=fmt(p.tot);$('.drops',b).insertAdjacentHTML('beforeend',card(w[i],{cls:'drop'}))});
      await wait(800);
    }
    const best=Math.max(...P.map(p=>p.tot)),W=pick(P.filter(p=>p.tot===best)),all=P.flatMap(p=>p.items),sum=all.reduce((a,x)=>a+price(x),0);
    P.forEach((p,i)=>$(`#p${i}`,el).classList.add(p===W?'winner':'loser'));
    st.stats.bt++;
    $('#rl',el).innerHTML=W.me?'Ты выиграл батл':`Победитель: ${W.n}`;
    $('#bend',el).innerHTML=`<button class="btn big" id="ba">Ещё раз · ${fmt(cost())}</button><button class="btn big ghost" id="bb">Изменить батл</button>`;
    $('#ba',el).onclick=start;$('#bb',el).onclick=setup;
    if(W.me){st.stats.bw++;const got=all.map(give);save();reveal(got,'Победа в батле')}
    else{save();sad();const m=modal(`<div class="big-e">🏆</div><h3 class="mt">Победитель: ${W.n}</h3><p class="mut" style="margin:10px 0">Забирает ${all.length} предм. на ${fmt(sum)}</p><div class="row"><button class="btn big">Закрыть</button></div>`);$('.btn',m).onclick=()=>m.remove()}
  };
  setup();
};

// ---------- Фарм ----------
PAGES.farm=el=>{
  let got=0;
  el.innerHTML=`<h1 class="ttl">Фарм</h1><p class="sub">+100 монет за каждый клик.</p><div class="farm"><button class="fbtn" id="fb">+100</button><div id="fc" class="mut">За эту сессию: ${fmt(0)}</div></div>`;
  const box=$('.farm',el);
  $('#fb',el).onclick=e=>{
    st.bal+=100;got+=100;save();beep(1400,.04,'sine',.04);
    $('#fc',el).innerHTML=`За эту сессию: ${fmt(got)}`;
    const r=box.getBoundingClientRect(),p=document.createElement('div');p.className='plus';p.textContent='+100';
    p.style.left=(e.clientX?e.clientX-r.left-30:r.width/2-30)+'px';p.style.top=(e.clientY?e.clientY-r.top-20:r.height/2)+'px';
    box.append(p);setTimeout(()=>p.remove(),900);
  };
};

// ---------- бонус и звук ----------
const bonusAmt=()=>300+lvl()*100,CD=5*60e3;
function bonusUI(){const left=CD-(Date.now()-st.bonus),b=$('#bonus');b.classList.toggle('ready',left<=0);b.innerHTML=left<=0?`Бонус +${bonusAmt()}`:new Date(left).toISOString().slice(14,19)}
$('#bonus').onclick=()=>{
  if(Date.now()-st.bonus<CD)return toast('Бонус ещё недоступен');
  const a=bonusAmt();st.bonus=Date.now();st.bal+=a;save();coin();toast(`Начислено ${fmt(a)}`);bonusUI();
};
$('#snd').onclick=()=>{st.sound=!st.sound;save()};
setInterval(bonusUI,1000);

save();bonusUI();
const h=location.hash.slice(1);go(PAGES[h]&&h!=='open'?h:'cases');
</script>
